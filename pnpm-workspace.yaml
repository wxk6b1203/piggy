packages:
  - apps/*
  - packages/*

allowBuilds:
  # 这两个包只作为 piggy-bridge 的**类型依赖**（@earendil-works/pi-coding-agent 传递引入）
  # 进入 workspace，运行时从不执行：显式拒绝其安装脚本，保持供应链面最小。
  '@google/genai': false
  esbuild: true
  protobufjs: false

# 这几个包是 pi 的发布单元，跟着 pi 的锚定版本走（2026-10-13：1.1.0 → 1.2.0，
# 与 fetch-pi-standalone.mjs / ci.yml 的锚点保持一致，由 scripts/check-pi-pin.mjs 对账）。
# 一条只留一个版本：pi 这些包是**同一版一起发**的，留着 `|| 旧版本` 只会掩盖漏改
# （pnpm 升级时会自动写成并集，要手工收一下）。1.2.0 新增了 codemode / mcp 两个发布单元，
# 所以它们没有 1.1.0 那一行。
minimumReleaseAgeExclude:
  - '@earendil-works/chord@1.1.0'
  - '@earendil-works/pi-agent-core@1.2.0'
  - '@earendil-works/pi-ai@1.2.0'
  - '@earendil-works/pi-coding-agent@1.2.0'
  - '@earendil-works/pi-telemetry@1.2.0'
  - '@earendil-works/pi-tui@1.2.0'
  - '@earendil-works/pi-codemode@1.2.0'
  - '@earendil-works/pi-mcp@1.2.0'
