name: ci
on:
  push: { branches: [main] }
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 不传 version：让 action 读 package.json 的 packageManager（pnpm@11.24.0）。
      # 显式写 version: 11 会因与 packageManager 不完全一致而报
      # "Multiple versions of pnpm specified"（@v4 浮动标签收紧校验后）。
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --if-present typecheck
      # 红线纪律（docs/08 §4）：此前 `pnpm lint` 是**空转**（根 package.json 有 lint 脚本，
      # 但没有任何子包定义它），四条自定义红线一条都没在跑。
      - run: pnpm -r --if-present lint
      # 收录的第三方插件不许被就地改过（docs/17 §2.2b：vendor.json 里的 sha256 对账）
      - run: node apps/desktop/scripts/vendor-plugin.mjs --check
      # pi 版本锚点六处对账（2026-10-09 加）：升级 pi 时漏改任何一处都不会报错，
      # 只会静默漂移（生成物、CI 安装版本、bridge 类型锚点、给用户看的 NOTICES…）
      - run: node apps/desktop/scripts/check-pi-pin.mjs
      - run: pnpm -r --if-present test
      - run: pnpm --filter @piggy/desktop build

  rust:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy, rustfmt }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: apps/desktop/src-tauri }
      - name: fmt
        run: cd apps/desktop/src-tauri && cargo fmt --check
      - name: clippy
        # `--all-targets` 是必须的：默认只 lint lib，test 目标里的提示会悄悄长回来
        # （2026-09-23 实测：只跑 lib 时漏掉 5 处，见 docs/15 §4）
        run: cd apps/desktop/src-tauri && cargo clippy --all-targets -- -D warnings
      - name: unit + fixtures 对拍
        run: cd apps/desktop/src-tauri && cargo test --lib --tests

  perf-lite:
    # perf-lite（docs/05 §6.3 M2）：S1/S3 缩短版 + 预算断言，PR 必跑
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      # 同 frontend job：不传 version，从 packageManager 取（见上）
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}
      - run: pnpm install --frozen-lockfile
      # playwright 只声明在 @piggy/desktop 里：从根 `pnpm exec` 找不到二进制
      # （2026-10-24 实测，这个 job 因此从未跑到过预算断言），必须 --filter 进包。
      - run: pnpm --filter @piggy/desktop exec playwright install chromium
      - name: S1/S3 缩短版 + 预算断言
        run: node apps/desktop/scripts/perf-run.mjs --lite
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf-lite-results
          path: apps/desktop/perf-results/
          retention-days: 7

  contract:
    # 契约测试（docs/02 §9）：安装真实 pi 对 C1–C10 实测
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: apps/desktop/src-tauri }
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      # 固定版本（不是 @latest）：契约矩阵验证过的是**这一个** pi。
      # 升级要用 apps/desktop/scripts/check-pi-pin.mjs 的清单走一遍（六处锚点一起改），
      # 否则 CI 会在别的 PR 上突然变红/变绿 —— 那是"版本漂移"而不是"这次改动坏了"。
      - run: npm install -g --ignore-scripts @earendil-works/pi-coding-agent@1.4.0
      - run: node apps/desktop/scripts/check-pi-pin.mjs --installed
      # 真机插件探针（docs/17 §2.2b）：核对外面那三条只有真 pi 才能验的事
      # （能加载 / `--tools` 会过滤插件工具 / 两份同名插件会让 pi 不进会话）。
      - run: node apps/desktop/scripts/pi-plugin-probe.mjs
      # provider 注入（2026-10-24）：契约测试依赖已配置的 provider（docs/02 §9）。
      # 此前这里的注释声称"provider 缺失时允许跳过"，但 contract.rs 从 M0 起就没有任何
      # 跳过逻辑，CI_CONTRACT 也从未被任何代码读过 —— 这个 job 在 runner 上从未绿过。
      # 现在用仓库 Secret 在 runner 上配出 ~/.pi/agent（形态复刻本机已验证的
      # models.json + settings.json）；key 只经 Secret 与环境变量，不进仓库、不进日志。
      - name: 注入 provider（Secret DEEPSEEK_API_KEY → ~/.pi/agent）
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          key = os.environ.get("DEEPSEEK_API_KEY", "").strip()
          if not key:
              print("::error::仓库 Secret DEEPSEEK_API_KEY 未配置 —— "
                    "Settings → Secrets and variables → Actions → Repository secrets 添加后重跑")
              sys.exit(1)
          home = os.path.expanduser("~/.pi/agent")
          os.makedirs(home, exist_ok=True)
          models = {
              "providers": {
                  "piggy-ci-deepseek": {
                      "name": "DeepSeek (Piggy CI)",
                      "baseUrl": "https://api.deepseek.com",
                      "api": "openai-completions",
                      "apiKey": key,
                      "models": [
                          {
                              "id": "deepseek-flash",
                              "name": "DeepSeek V4.1 Flash",
                              "reasoning": True,
                              "input": ["text", "image"],
                              "contextWindow": 1000000,
                              "maxTokens": 384000,
                              "thinkingLevelMap": {"low": "low", "high": "high", "max": "max"},
                          }
                      ],
                  }
              }
          }
          settings = {"defaultProvider": "piggy-ci-deepseek", "defaultModel": "deepseek-flash"}
          json.dump(models, open(os.path.join(home, "models.json"), "w"), ensure_ascii=False, indent=2)
          json.dump(settings, open(os.path.join(home, "settings.json"), "w"), ensure_ascii=False, indent=2)
          print("provider 已写入 ~/.pi/agent（models.json + settings.json）")
          PY
      - name: 契约测试（真 provider，消耗极少量 token）
        run: cd apps/desktop/src-tauri && cargo test --features contract --test contract -- --test-threads=2
