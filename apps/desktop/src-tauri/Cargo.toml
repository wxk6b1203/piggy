[package]
name = "piggy-desktop"
version = "0.1.0"
description = "Piggy — pi 的图形驾驶舱（Tauri 2 壳）"
edition = "2021"
license = "GPL-3.0-or-later"

[lib]
name = "piggy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# 契约测试：需要 PATH 上有真实 pi 二进制（docs/02 §9）
contract = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"
portable-pty = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "process",
    "io-util",
    "sync",
    "time",
] }
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
notify = "7"
# 「获取可用模型 / 检测」要真发一次 HTTP（列模型）。reqwest 早已在依赖树里
# （tauri-plugin-updater 用它），所以加进来不增加链接产物，只是让它可被直接调用。
# features 与 tauri-plugin-updater 里的 reqwest 保持一致（default-features = false +
# json/stream）：这样加进来只是让已有依赖可被直接调用，不改变依赖图，
# 也就不会把 rustls 的 aws-lc-rs 供应商拽进来（镜像上取不到那个版本）。
reqwest = { version = "0.13", default-features = false, features = ["json", "stream"] }
# reqwest 走的是 rustls 的 no-provider 变体（tauri 与 updater 都这么配），
# 所以进程里必须有人先装一个 crypto provider，否则建 Client 时直接 panic。
# 与 tauri/src/protocol/tauri.rs:44 和 tauri-plugin-updater/src/updater.rs:492 同款做法。
rustls = { version = "0.23", default-features = false, features = ["ring"] }
trash = "5"

[dev-dependencies]
tempfile = "3"

[[test]]
name = "contract"
path = "tests/contract.rs"
required-features = ["contract"]

[[test]]
name = "fixtures_parse"
path = "tests/fixtures_parse.rs"

[[test]]
name = "ipc_contract"
path = "tests/ipc_contract.rs"

# 低磁盘占用：dev/test 构建不带 debuginfo（M0 机器磁盘紧张；需要调试时临时去掉）
[profile.dev]
debug = 0
[profile.test]
debug = 0
